<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel Forge — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    :root {
      --bg-base:    #0f172a;
      --bg-surface: #1e293b;
      --bg-card:    #1e293b;
      --border:     #334155;
      --accent:     #3b82f6;
      --purple:     #7c3aed;
      --text:       #e2e8f0;
      --muted:      #94a3b8;
    }

    body { background: var(--bg-base); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Panel transitions */
    .panel-enter { animation: fadeSlide .25s ease forwards; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #2d3f55 50%, #1e293b 75%);
                background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Toast */
    .toast-enter { animation: toastIn .3s ease forwards; }
    .toast-leave { animation: toastOut .3s ease forwards; }
    @keyframes toastIn  { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes toastOut { from { opacity:1; transform:translateX(0); }   to { opacity:0; transform:translateX(20px); } }

    /* Sidebar nav item active glow */
    .nav-active { background: rgba(59,130,246,.15); border-left: 2px solid #3b82f6; color: #93c5fd; }
    .nav-item { border-left: 2px solid transparent; transition: all .2s; }
    .nav-item:hover:not(.nav-active) { background: rgba(255,255,255,.04); color: #e2e8f0; }

    /* Glyph accent animations */
    .glyph-pulse { animation: glyphPulse 3s ease-in-out infinite; }
    @keyframes glyphPulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }

    /* Zone indicator */
    .zone-green  { box-shadow: 0 0 16px rgba(34,197,94,.4); }
    .zone-yellow { box-shadow: 0 0 16px rgba(234,179,8,.4); }
    .zone-red    { box-shadow: 0 0 16px rgba(239,68,68,.4); }

    /* Reader toolbar buttons — big colored Tk-style action tiles */
    .reader-tbtn {
      color: #fff; font-weight: 700; border: 0; border-radius: 10px;
      padding: .6rem .5rem; cursor: pointer; transition: transform .08s, filter .15s;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: .5rem; min-height: 3.25rem; font-size: .95rem;
    }
    .reader-tbtn:hover:not(:disabled)  { filter: brightness(1.12); }
    .reader-tbtn:active:not(:disabled) { transform: scale(.97); }
    .reader-tbtn:disabled              { opacity: .45; cursor: not-allowed; }
    .reader-hl { box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }

    /* WS log fade */
    .ws-event { animation: fadeSlide .3s ease; }

    /* Input / button base */
    input, textarea, select {
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      border-radius: 8px; padding: .5rem .75rem; width: 100%; outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
    .btn-primary {
      background: #3b82f6; color: #fff; border-radius: 8px; padding: .5rem 1.25rem;
      font-weight: 600; cursor: pointer; transition: background .2s, transform .1s;
    }
    .btn-primary:hover   { background: #2563eb; }
    .btn-primary:active  { transform: scale(.97); }
    .btn-secondary {
      background: transparent; border: 1px solid #334155; color: #94a3b8;
      border-radius: 8px; padding: .5rem 1.25rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-secondary:hover { border-color: #3b82f6; color: #e2e8f0; }
    .btn-danger {
      background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: #f87171;
      border-radius: 8px; padding: .5rem 1.25rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-danger:hover { background: rgba(239,68,68,.3); }

    /* Card */
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }

    /* Stat card hover */
    .stat-card { transition: transform .2s, box-shadow .2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,.4); }

    /* Modal backdrop */
    .modal-bg { background: rgba(0,0,0,.7); backdrop-filter: blur(4px); }

    /* Tag badge */
    .tag { background: rgba(124,58,237,.2); border: 1px solid rgba(124,58,237,.4); color: #a78bfa;
           border-radius: 4px; padding: 2px 8px; font-size: .75rem; }

    /* Thread item */
    .thread-item { transition: background .15s; }
    .thread-item:hover { background: rgba(255,255,255,.04); }

    /* Glyph card hover */
    .glyph-card { transition: transform .2s, border-color .2s; }
    .glyph-card:hover { transform: scale(1.03); border-color: #7c3aed; }

    /* Light theme overrides */
    body.light {
      --bg-base: #f1f5f9; --bg-surface: #ffffff; --bg-card: #ffffff;
      --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
      background: #f1f5f9; color: #1e293b;
    }
    body.light input, body.light textarea, body.light select { background: #f8fafc; border-color: #e2e8f0; color: #1e293b; }
    body.light .card { background: #ffffff; border-color: #e2e8f0; }
    body.light .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; }
    body.light .nav-active { background: rgba(59,130,246,.1); }
    body.light .nav-item:hover:not(.nav-active) { background: rgba(0,0,0,.04); }
  </style>
</head>
<body id="appBody" x-data="sentinelApp()" x-init="init()" x-cloak>

<!-- ─── TOAST CONTAINER ─── -->
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none" style="min-width:280px">
  <template x-for="toast in toasts" :key="toast.id">
    <div class="toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium"
         :class="toast.type==='success'
           ? 'bg-emerald-900 border border-emerald-700 text-emerald-200'
           : toast.type==='error'
           ? 'bg-red-900 border border-red-700 text-red-200'
           : 'bg-slate-800 border border-slate-600 text-slate-200'">
      <span x-text="toast.type==='success' ? '✦' : toast.type==='error' ? '◈' : '◇'"></span>
      <span x-text="toast.msg"></span>
    </div>
  </template>
</div>

<!-- ─── MODAL ─── -->
<template x-if="modal.show">
  <div class="modal-bg fixed inset-0 z-40 flex items-center justify-center p-4" @click.self="modal.show=false">
    <div class="card p-6 w-full max-w-md panel-enter">
      <h3 class="text-lg font-semibold mb-2 text-white" x-text="modal.title"></h3>
      <p class="text-sm text-slate-400 mb-6" x-text="modal.body"></p>
      <div class="flex gap-3 justify-end">
        <button class="btn-secondary" @click="modal.show=false">Cancel</button>
        <button class="btn-danger" @click="modal.confirm(); modal.show=false" x-text="modal.confirmLabel || 'Confirm'"></button>
      </div>
    </div>
  </div>
</template>

<!-- ═══════════════════════════════════════════
     VIEW 1 — AUTH
═══════════════════════════════════════════ -->
<template x-if="!authToken">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 mb-3">
          <span class="text-3xl glyph-pulse" style="color:#7c3aed">⬡</span>
          <span class="text-3xl font-black tracking-tight text-white">SENTINEL <span style="color:#3b82f6">FORGE</span></span>
          <span class="text-3xl glyph-pulse" style="color:#3b82f6; animation-delay:.5s">◈</span>
        </div>
        <p class="text-sm text-slate-400 tracking-widest uppercase">Cognitive Infrastructure Platform</p>
      </div>

      <!-- Auth card -->
      <div class="card p-8">
        <!-- Tab toggle -->
        <div class="flex bg-slate-900 rounded-lg p-1 mb-6">
          <button class="flex-1 py-2 text-sm font-semibold rounded-md transition-all"
                  :class="authTab==='login' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'"
                  @click="authTab='login'; authError=''">Login</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-md transition-all"
                  :class="authTab==='signup' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'"
                  @click="authTab='signup'; authError=''">Sign Up</button>
        </div>

        <!-- Error -->
        <template x-if="authError">
          <div class="bg-red-900/40 border border-red-700 text-red-300 text-sm px-4 py-3 rounded-lg mb-4 flex items-center gap-2">
            <span>◈</span><span x-text="authError"></span>
          </div>
        </template>

        <!-- LOGIN FORM -->
        <template x-if="authTab==='login'">
          <form @submit.prevent="login()" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Email</label>
              <input type="email" x-model="loginForm.email" placeholder="you@example.com" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Password</label>
              <input type="password" x-model="loginForm.password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-primary w-full mt-2 flex items-center justify-center gap-2 py-2.5" :disabled="authLoading">
              <template x-if="authLoading">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
                </svg>
              </template>
              <span x-text="authLoading ? 'Authenticating…' : 'Login'"></span>
            </button>
            <p class="text-center text-xs text-slate-500 pt-2">Demo: use any email / password to enter mock mode</p>
          </form>
        </template>

        <!-- SIGNUP FORM -->
        <template x-if="authTab==='signup'">
          <form @submit.prevent="signup()" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Name</label>
              <input type="text" x-model="signupForm.name" placeholder="Jane Forge" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Email</label>
              <input type="email" x-model="signupForm.email" placeholder="you@example.com" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Password</label>
              <input type="password" x-model="signupForm.password" placeholder="••••••••" required />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Plan</label>
              <select x-model="signupForm.tier">
                <option value="starter">Starter — Free</option>
                <option value="pro">Pro — $49/mo</option>
                <option value="enterprise">Enterprise — Custom</option>
              </select>
            </div>
            <button type="submit" class="btn-primary w-full mt-2 flex items-center justify-center gap-2 py-2.5" :disabled="authLoading">
              <template x-if="authLoading">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
                </svg>
              </template>
              <span x-text="authLoading ? 'Creating account…' : 'Create Account'"></span>
            </button>
          </form>
        </template>
      </div>

      <p class="text-center text-xs text-slate-600 mt-6">✦ Powered by Sentinel Cognitive Engine v2 ✦</p>
    </div>
  </div>
</template>

<!-- ═══════════════════════════════════════════
     VIEW 2 — MAIN DASHBOARD
═══════════════════════════════════════════ -->
<template x-if="authToken">
  <div class="flex flex-col min-h-screen">

    <!-- TOP NAV -->
    <header class="flex items-center justify-between px-6 py-3 border-b sticky top-0 z-30"
            style="background:#1e293b; border-color:#334155;">
      <div class="flex items-center gap-3">
        <span style="color:#7c3aed" class="text-xl">⬡</span>
        <span class="font-black tracking-tight text-white text-lg">SENTINEL <span style="color:#3b82f6">FORGE</span></span>
      </div>
      <div class="flex items-center gap-4">
        <!-- API health indicator -->
        <div class="flex items-center gap-2 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full" :class="apiHealthy ? 'bg-emerald-400' : 'bg-red-400'"
                :title="apiHealthy ? 'API Online' : 'API Offline — mock mode'"></span>
          <span x-text="apiHealthy ? 'Online' : 'Mock'"></span>
        </div>
        <div class="hidden sm:flex items-center gap-2 text-sm text-slate-300">
          <span class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold text-white"
                x-text="userData.email ? userData.email[0].toUpperCase() : 'U'"></span>
          <span x-text="userData.email || 'user@sentinel.io'"></span>
        </div>
        <button class="btn-secondary text-xs px-3 py-1.5" @click="logout()">Logout</button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

      <!-- SIDEBAR -->
      <aside class="hidden md:flex flex-col w-56 border-r shrink-0 py-4 px-2 gap-1 overflow-y-auto"
             style="background:#1e293b; border-color:#334155;">
        <template x-for="item in navItems" :key="item.id">
          <button class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 w-full text-left"
                  :class="currentView===item.id ? 'nav-active' : ''"
                  @click="switchView(item.id)">
            <span x-text="item.icon" class="text-base w-5 text-center"></span>
            <span x-text="item.label"></span>
          </button>
        </template>

        <div class="mt-auto pt-4 border-t mx-2" style="border-color:#334155;">
          <div class="text-xs text-slate-500 px-3 mb-2 uppercase tracking-wider">Glyphic State</div>
          <div class="flex items-center gap-2 px-3">
            <span class="glyph-pulse text-purple-400">◇</span>
            <span class="text-xs text-slate-400">Zone: </span>
            <span class="text-xs font-semibold"
                  :class="cogZone==='GREEN' ? 'text-emerald-400' : cogZone==='YELLOW' ? 'text-yellow-400' : 'text-red-400'"
                  x-text="cogZone"></span>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="flex-1 overflow-y-auto p-4 md:p-6" style="background:#0f172a;">

        <!-- ── DASHBOARD PANEL ── -->
        <div x-show="currentView==='dashboard'" class="panel-enter space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-2xl font-bold text-white">Dashboard</h1>
              <p class="text-sm text-slate-400 mt-1">Cognitive system overview ✦</p>
            </div>
            <button class="btn-primary text-sm" @click="refreshDashboard()">↻ Refresh</button>
          </div>

          <!-- Stat Cards -->
          <div class="grid grid-cols-2 xl:grid-cols-4 gap-4">
            <template x-for="stat in dashStats" :key="stat.label">
              <div class="card stat-card p-5">
                <template x-if="dashLoading">
                  <div><div class="skeleton h-3 w-20 mb-3"></div><div class="skeleton h-8 w-16"></div></div>
                </template>
                <template x-if="!dashLoading">
                  <div>
                    <div class="flex items-center justify-between mb-3">
                      <span class="text-xs font-medium text-slate-400 uppercase tracking-wider" x-text="stat.label"></span>
                      <span x-text="stat.icon" class="text-lg"></span>
                    </div>
                    <div class="text-3xl font-black text-white" x-text="stat.value"></div>
                    <div class="text-xs mt-1" :class="stat.trend > 0 ? 'text-emerald-400' : 'text-red-400'"
                         x-text="(stat.trend > 0 ? '↑ ' : '↓ ') + Math.abs(stat.trend) + '% this hour'"></div>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- ┌─ BOOK LIBRARY HERO CARD ──────────────────────────────────┐
               Headlines the integration: the standalone Book Reader writes
               to disk; the platform projects it here with live counts and
               a cross-excerpt search the desktop app cannot do. -->
          <div class="card p-5 border border-blue-700/60"
               style="background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(124,58,237,0.10));">
            <div class="flex items-start justify-between gap-3 flex-wrap">
              <div class="flex items-start gap-4">
                <div class="text-4xl">📚</div>
                <div>
                  <div class="flex items-center gap-2">
                    <h2 class="text-lg font-semibold text-white">Book Reader Library</h2>
                    <span class="text-[10px] uppercase tracking-wider text-blue-200 bg-blue-900/50 px-2 py-0.5 rounded">linked</span>
                  </div>
                  <p class="text-xs text-slate-400 mt-1">
                    Excerpts saved from the
                    <strong class="text-slate-200">Sentinel Forge Book Reader</strong>
                    on this machine. The platform adds AI search and cross-excerpt analysis
                    on top of what the desktop app saves.
                  </p>
                </div>
              </div>
              <div class="flex gap-2">
                <button class="btn-secondary text-xs" @click="refreshLibrary()">⟳ Refresh</button>
                <button class="btn-primary text-xs" @click="switchView('library')">Open Library →</button>
              </div>
            </div>

            <!-- Live numbers strip -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-4">
              <div class="bg-slate-900/60 rounded-lg p-3 border border-slate-800">
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Saves</div>
                <div class="text-2xl font-bold text-white" x-text="libraryStats?.total_saves ?? '—'"></div>
              </div>
              <div class="bg-emerald-950/40 rounded-lg p-3 border border-emerald-900">
                <div class="text-[10px] uppercase tracking-wider text-emerald-300">🟢 Green</div>
                <div class="text-2xl font-bold text-white" x-text="libraryStats?.by_zone?.GREEN ?? '—'"></div>
              </div>
              <div class="bg-amber-950/40 rounded-lg p-3 border border-amber-900">
                <div class="text-[10px] uppercase tracking-wider text-amber-300">🟡 Yellow</div>
                <div class="text-2xl font-bold text-white" x-text="libraryStats?.by_zone?.YELLOW ?? '—'"></div>
              </div>
              <div class="bg-rose-950/40 rounded-lg p-3 border border-rose-900">
                <div class="text-[10px] uppercase tracking-wider text-rose-300">🔴 Red</div>
                <div class="text-2xl font-bold text-white" x-text="libraryStats?.by_zone?.RED ?? '—'"></div>
              </div>
              <div class="bg-slate-900/60 rounded-lg p-3 border border-slate-800">
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Words</div>
                <div class="text-2xl font-bold text-white" x-text="(libraryStats?.total_words ?? 0).toLocaleString()"></div>
              </div>
            </div>

            <!-- Inline Ask box — value prop is visible from the home view -->
            <div class="flex gap-2 mt-4">
              <input type="text"
                     placeholder='Ask your library — e.g. "what did I save about stoicism?"'
                     x-model="askQuestion"
                     @keydown.enter="askLibrary(); switchView('library');"
                     class="flex-1 text-sm">
              <button class="btn-primary text-sm whitespace-nowrap"
                      @click="askLibrary(); switchView('library');">
                ✨ Ask →
              </button>
            </div>
            <p class="text-[10px] text-slate-500 mt-2">
              The Book Reader can search inside one file. The platform searches across all
              <span class="text-slate-300 font-semibold" x-text="libraryStats?.total_saves ?? 0"></span>
              of your saves at once.
            </p>
          </div>
          <!-- └────────────────────────────────────────────────────────────┘ -->

          <!-- Chart + Zone Status -->
          <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
            <div class="card p-5 xl:col-span-2">
              <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-white">Cognitive Load</h2>
                <span class="tag">Live</span>
              </div>
              <canvas id="cogChart" height="100"></canvas>
            </div>
            <div class="card p-5 flex flex-col">
              <h2 class="font-semibold text-white mb-4">Zone Status</h2>
              <div class="flex-1 flex flex-col items-center justify-center gap-4">
                <div class="w-24 h-24 rounded-full flex items-center justify-center text-3xl font-black border-4"
                     :class="cogZone==='GREEN'  ? 'bg-emerald-950 border-emerald-500 text-emerald-300 zone-green'
                           : cogZone==='YELLOW' ? 'bg-yellow-950 border-yellow-500 text-yellow-300 zone-yellow'
                           :                      'bg-red-950 border-red-500 text-red-300 zone-red'"
                     x-text="cogZone==='GREEN' ? '✓' : cogZone==='YELLOW' ? '!' : '✕'"></div>
                <div class="text-center">
                  <div class="text-lg font-bold"
                       :class="cogZone==='GREEN' ? 'text-emerald-400' : cogZone==='YELLOW' ? 'text-yellow-400' : 'text-red-400'"
                       x-text="cogZone + ' ZONE'"></div>
                  <div class="text-xs text-slate-400 mt-1" x-text="'Load: ' + cogLoad + '%'"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Action -->
          <div class="card p-5">
            <h2 class="font-semibold text-white mb-4">◈ Quick Process</h2>
            <textarea x-model="quickInput" rows="3" placeholder="Enter cognitive input… e.g. APEX->CORE->EMIT or natural language" class="mb-3"></textarea>
            <div class="flex gap-3">
              <button class="btn-primary" @click="quickProcess()" :disabled="quickLoading">
                <span x-text="quickLoading ? 'Processing…' : 'Submit'"></span>
              </button>
              <button class="btn-secondary" @click="quickInput=''; quickResult=null">Clear</button>
            </div>
            <template x-if="quickResult">
              <div class="mt-4 bg-slate-900 rounded-lg p-4 text-sm font-mono text-emerald-300 border border-emerald-900 overflow-auto max-h-40">
                <pre x-text="JSON.stringify(quickResult, null, 2)"></pre>
              </div>
            </template>
          </div>
        </div>

        <!-- ── BOOK READER PANEL (Tk-app parity in the dashboard) ── -->
        <div x-show="currentView==='reader'" class="panel-enter space-y-3" x-cloak>

          <!-- ─ Status strip (Energy / Zone / Protocols / Session) ───────── -->
          <div class="card px-4 py-2 flex items-center gap-4 flex-wrap text-sm">
            <div class="flex items-center gap-2">
              <span class="text-slate-400 text-xs uppercase tracking-wider">Energy:</span>
              <input type="range" min="1" max="10" x-model="readerEnergy" class="w-24" style="padding:0;">
              <span class="font-bold text-white" x-text="readerEnergy + '/10'"></span>
            </div>
            <span class="px-3 py-1 rounded font-bold text-white text-xs"
                  :class="readerEnergy >= 7 ? 'bg-emerald-600 zone-green' : readerEnergy >= 4 ? 'bg-amber-600 zone-yellow' : 'bg-rose-600 zone-red'"
                  x-text="(readerEnergy >= 7 ? '● GREEN ZONE' : readerEnergy >= 4 ? '● YELLOW ZONE' : '● RED ZONE')"></span>
            <span class="px-2 py-0.5 rounded bg-emerald-700/40 text-emerald-300 text-xs border border-emerald-700">
              Ω1 <span x-show="readerProtocols.omega1">✓</span><span x-show="!readerProtocols.omega1">·</span>
            </span>
            <span class="px-2 py-0.5 rounded bg-emerald-700/40 text-emerald-300 text-xs border border-emerald-700">
              Joy <span x-show="readerProtocols.joy">✓</span><span x-show="!readerProtocols.joy">·</span>
            </span>
            <span class="px-2 py-0.5 rounded bg-emerald-700/40 text-emerald-300 text-xs border border-emerald-700">
              Coconut <span x-show="readerProtocols.coconut">✓</span><span x-show="!readerProtocols.coconut">·</span>
            </span>
            <div class="ml-auto flex items-center gap-2">
              <button class="px-3 py-1 rounded text-white text-xs font-semibold"
                      :class="readerSessionStarted ? 'bg-slate-700' : 'bg-emerald-600 hover:bg-emerald-500'"
                      @click="readerStartSession()"
                      :disabled="readerSessionStarted">▶ Start</button>
              <button class="px-3 py-1 rounded text-white text-xs font-semibold bg-slate-700 hover:bg-slate-600"
                      @click="readerEndSession()">⬛ End</button>
              <span class="text-xs text-slate-400" x-text="new Date().toLocaleDateString('en-CA')"></span>
            </div>
          </div>

          <!-- ─ Big colored toolbar (Open / Library / Paste / Read aloud / Stop / Voice note / Save / Study) ── -->
          <div class="grid grid-cols-4 md:grid-cols-8 gap-2">
            <button class="reader-tbtn" style="background:#0891b2;" @click="readerOpenModalShow()">
              <span class="text-2xl">📂</span><span>Open</span>
            </button>
            <button class="reader-tbtn" style="background:#7c3aed;" @click="readerToolbarLibrary()">
              <span class="text-2xl">📚</span><span>Library</span>
            </button>
            <button class="reader-tbtn" style="background:#ea580c;" @click="readerToolbarPaste()">
              <span class="text-2xl">📋</span><span>Paste</span>
            </button>
            <button class="reader-tbtn" style="background:#16a34a;" @click="readerSpeak()" :disabled="readerSpeaking">
              <span class="text-2xl">🔊</span><span>Read aloud</span>
            </button>
            <button class="reader-tbtn" style="background:#475569;" @click="readerStopSpeak()" :disabled="!readerSpeaking">
              <span class="text-2xl">⬛</span><span>Stop</span>
            </button>
            <button class="reader-tbtn" style="background:#0ea5e9;" @click="readerVoiceNote()">
              <span class="text-2xl">🎙</span><span>Voice note</span>
            </button>
            <button class="reader-tbtn" style="background:#dc2626;" @click="saveReaderExcerpt(!!readerSelection)" :disabled="!readerCurrent || readerSaving">
              <span class="text-2xl">💾</span><span x-text="readerSaving ? 'Saving...' : 'Save'"></span>
            </button>
            <button class="reader-tbtn" style="background:#991b1b;" @click="readerToolbarStudy()">
              <span class="text-2xl">📓</span><span>Study</span>
            </button>
          </div>

          <!-- ─ Highlight + Timer controls ────────────────────────────────── -->
          <div class="card px-4 py-2 flex items-center gap-3 flex-wrap text-sm">
            <span class="text-slate-400 text-xs uppercase tracking-wider">Highlight by:</span>
            <select x-model="readerHighlightBy" class="text-xs max-w-[8rem]">
              <option value="sentence">Sentence</option>
              <option value="word">Word</option>
              <option value="paragraph">Paragraph</option>
            </select>
            <span class="text-slate-400 text-xs uppercase tracking-wider ml-2">Color:</span>
            <select x-model="readerHighlightSwatch" @change="pickHighlightSwatch(readerHighlightSwatch)" class="text-xs max-w-[6.5rem]">
              <template x-for="(hex,name) in readerHighlightSwatches" :key="name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
            <span class="w-5 h-5 rounded border-2 border-slate-500" :style="'background:' + readerHighlightColor"></span>
            <button class="px-3 py-1 rounded text-white text-xs font-bold" style="background:#ea580c;"
                    @click="readerHighlightSelection()">
              ✎ Highlight selection
            </button>

            <span class="text-slate-400 text-xs uppercase tracking-wider ml-4">⏱ Timer:</span>
            <select x-model="readerTimerDuration" class="text-xs max-w-[6rem]" :disabled="readerTimerRunning">
              <option :value="5">5 min</option>
              <option :value="10">10 min</option>
              <option :value="15">15 min</option>
              <option :value="20">20 min</option>
              <option :value="25">25 min</option>
              <option :value="45">45 min</option>
            </select>
            <button class="px-3 py-1 rounded text-white text-xs font-bold"
                    :class="readerTimerRunning ? 'bg-rose-600' : 'bg-emerald-600 hover:bg-emerald-500'"
                    @click="readerStartTimer()"
                    x-text="readerTimerRunning ? 'Stop' : 'Start'"></button>
            <span class="font-mono text-white font-bold text-base" x-text="readerTimerDisplay()"></span>
          </div>

          <!-- ─ Reading folders banner ────────────────────────────────────── -->
          <div class="card px-4 py-2 flex items-center gap-3 flex-wrap text-sm">
            <span class="text-slate-300 font-semibold">📁 Reading folders:</span>
            <template x-for="f in readerFolderConfig" :key="f.path">
              <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded border text-[11px]"
                    :class="f.exists ? (f.is_excerpts_dir ? 'bg-emerald-900/30 border-emerald-700 text-emerald-200' : 'bg-slate-800 border-slate-600 text-slate-200') : 'bg-rose-900/30 border-rose-700 text-rose-200 line-through'">
                <span class="truncate max-w-[20rem]" :title="f.path" x-text="f.path"></span>
                <span class="text-slate-400 font-mono" x-text="'· ' + f.count + ' files'"></span>
                <span x-show="f.is_excerpts_dir" class="text-emerald-400 ml-0.5">excerpts</span>
                <button class="text-slate-400 hover:text-rose-300 ml-1" title="Remove"
                        @click="removeReaderFolder(f.path)">×</button>
              </span>
            </template>
            <button class="px-2 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold ml-auto"
                    @click="readerShowFolderManager = !readerShowFolderManager">
              <span x-show="!readerShowFolderManager">＋ Add folder</span>
              <span x-show="readerShowFolderManager">close</span>
            </button>
          </div>
          <div class="card px-4 py-3" x-show="readerShowFolderManager" x-cloak>
            <label class="text-[10px] uppercase tracking-wider text-slate-400 block mb-1">
              Paste the full path to a folder containing your books
              <span class="text-slate-500">(e.g. <code>C:\Users\you\Documents\Books</code> or <code>D:\Library</code>)</span>
            </label>
            <div class="flex gap-2">
              <input type="text" x-model="readerNewFolder"
                     placeholder="C:\Users\sbrya\OneDrive\Documents\Books"
                     @keydown.enter="addReaderFolder()"
                     class="flex-1 text-sm font-mono">
              <button class="btn-primary text-xs whitespace-nowrap"
                      @click="addReaderFolder()" :disabled="readerFolderLoading">
                <span x-show="!readerFolderLoading">＋ Add</span>
                <span x-show="readerFolderLoading">Adding…</span>
              </button>
            </div>
            <p class="text-[10px] text-slate-500 mt-2">
              The folder is scanned recursively for <code>.md / .txt / .docx / .pdf / .html / .rtf</code>.
              Your books stay where they are — this just tells the reader where to look.
            </p>
          </div>

          <!-- ─ Status message ────────────────────────────────────────────── -->
          <div class="text-xs text-slate-400 italic px-1" x-text="readerStatusMessage"></div>

          <!-- ─ Two-pane main area: notes (narrow left) + reader/commentary (wide right) ── -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-3">

            <!-- LEFT: notes pane -->
            <div class="card p-0 lg:col-span-3 overflow-hidden flex flex-col">
              <div class="px-3 py-2 border-b border-slate-700 text-xs text-slate-400 uppercase tracking-wider flex items-center justify-between">
                <span>📝 Notes</span>
                <button class="text-[10px] text-slate-500 hover:text-slate-200" @click="readerNotes=''">clear</button>
              </div>
              <textarea x-model="readerNotes"
                        class="flex-1 bg-transparent border-0 rounded-none text-sm text-slate-200 resize-none min-h-[24rem]"
                        style="padding:0.75rem;"
                        placeholder="Jot notes while you read — they stay local to this session."></textarea>
            </div>

            <!-- RIGHT: reader (top) + commentary (bottom) -->
            <div class="lg:col-span-9 space-y-3 min-w-0">

              <!-- Reader -->
              <div class="card p-0 overflow-hidden">
                <div class="px-4 py-2 border-b border-slate-700 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-base">📖</span>
                    <span class="text-sm text-white font-semibold truncate"
                          x-text="readerCurrent ? readerCurrent.name : 'No book open'"></span>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[10px] text-slate-400" x-show="readerCurrent">
                      <span x-text="(readerCurrent?.word_count||0).toLocaleString()"></span> words
                    </span>
                    <span x-show="readerSpeaking" class="text-[10px] text-emerald-300 animate-pulse">🔊 reading…</span>
                  </div>
                </div>
                <template x-if="readerLoading">
                  <div class="p-6 space-y-2">
                    <div class="skeleton h-4 w-2/3"></div>
                    <div class="skeleton h-4 w-full"></div>
                    <div class="skeleton h-4 w-full"></div>
                  </div>
                </template>
                <template x-if="!readerCurrent && !readerLoading">
                  <div class="text-slate-500 text-sm text-center py-16">
                    Click <strong class="text-cyan-400">📂 Open</strong> in the toolbar to pick a book,
                    or <strong class="text-orange-400">📋 Paste</strong> from your clipboard.
                  </div>
                </template>
                <div id="reader-body"
                     class="px-6 py-5 max-h-[55vh] overflow-y-auto text-slate-200 text-[15px] leading-relaxed whitespace-pre-wrap"
                     style="font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;"
                     @mouseup="captureReaderSelection()"
                     @keyup="captureReaderSelection()"
                     x-show="readerCurrent"
                     x-text="readerCurrent?.content || ''"></div>
              </div>

              <!-- Commentary -->
              <div class="card p-0 overflow-hidden">
                <div class="px-4 py-2 border-b border-slate-700 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="text-base">📄</span>
                    <span class="text-sm text-white font-semibold truncate"
                          x-text="readerCommentary ? readerCommentary.name : 'Commentary'"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="px-2 py-1 rounded text-white text-[11px] font-semibold bg-cyan-600 hover:bg-cyan-500"
                            @click="readerOpenCommentary()">📂 Open commentary…</button>
                    <button class="px-2 py-1 rounded text-slate-300 text-[11px] font-semibold bg-slate-700 hover:bg-slate-600"
                            @click="readerClearCommentary()">Clear</button>
                  </div>
                </div>
                <div class="px-6 py-4 max-h-[28vh] overflow-y-auto text-slate-300 text-[13px] leading-relaxed whitespace-pre-wrap"
                     style="font-family: Georgia, serif;"
                     x-text="readerCommentary ? readerCommentary.content : ''"></div>
                <div x-show="!readerCommentary" class="text-slate-500 text-xs text-center py-6 italic">
                  Open a second file here for side-by-side reading.
                </div>
              </div>

              <!-- Save metadata row (compact, below the reader) -->
              <div class="card p-3 flex items-end gap-2 flex-wrap" x-show="readerCurrent">
                <div class="flex-1 min-w-[10rem]">
                  <label class="text-[10px] uppercase tracking-wider text-slate-400 block mb-1">Title hint</label>
                  <input type="text" x-model="readerSaveTitle" class="text-xs">
                </div>
                <div class="w-24">
                  <label class="text-[10px] uppercase tracking-wider text-slate-400 block mb-1">Zone</label>
                  <select x-model="readerSaveZone" class="text-xs">
                    <option value="GREEN">🟢 GREEN</option>
                    <option value="YELLOW">🟡 YELLOW</option>
                    <option value="RED">🔴 RED</option>
                  </select>
                </div>
                <div class="w-32">
                  <label class="text-[10px] uppercase tracking-wider text-slate-400 block mb-1">
                    Cog. load <span class="text-slate-200 font-bold" x-text="readerSaveLoad"></span>
                  </label>
                  <input type="range" min="1" max="10" x-model="readerSaveLoad" class="w-full" style="padding:0;">
                </div>
                <div class="text-[10px] text-slate-400 self-end">
                  <span x-show="readerSelection" class="text-emerald-300 font-mono"
                        x-text="readerSelection.length + ' chars selected'"></span>
                  <span x-show="!readerSelection" class="italic">select text → 💾 Save saves selection · no selection → saves whole page</span>
                </div>
              </div>
            </div>
          </div>

          <!-- ─ Open-file modal ─────────────────────────────────────────── -->
          <div x-show="readerShowOpenModal" x-cloak
               class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"
               @click.self="readerShowOpenModal=false">
            <div class="card w-full max-w-3xl max-h-[80vh] flex flex-col overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                <h2 class="text-base font-semibold text-white">📂 Open a book</h2>
                <button class="text-slate-400 hover:text-white text-xl leading-none" @click="readerShowOpenModal=false">×</button>
              </div>
              <div class="px-4 py-2 border-b border-slate-800 flex items-center gap-2">
                <input type="text" placeholder="Filter..." x-model="readerSearch" class="text-xs flex-1">
                <select x-model="readerExtFilter" @change="refreshReaderList()" class="text-xs max-w-[8rem]">
                  <option value="ALL">All formats</option>
                  <option value="md">Markdown</option>
                  <option value="txt">Text</option>
                  <option value="docx">Word</option>
                  <option value="pdf">PDF</option>
                  <option value="html">HTML</option>
                </select>
                <button class="btn-secondary text-xs" @click="refreshReaderList()">⟳</button>
              </div>
              <div class="overflow-y-auto divide-y divide-slate-800 flex-1">
                <template x-if="readerListLoading">
                  <div class="p-4 space-y-2">
                    <div class="skeleton h-4 w-3/4"></div>
                    <div class="skeleton h-4 w-2/3"></div>
                  </div>
                </template>
                <template x-for="f in filteredReaderFiles()" :key="f.path">
                  <button class="w-full text-left px-4 py-2.5 hover:bg-slate-800/60 transition"
                          @click="readerOpenModalPick(f)">
                    <div class="flex items-start justify-between gap-2">
                      <div class="text-sm text-white truncate flex-1" x-text="f.name"></div>
                      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 shrink-0"
                            x-text="extLabel(f.ext)"></span>
                    </div>
                    <div class="text-[10px] text-slate-500 truncate mt-0.5" x-text="f.rel_path"></div>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- ── BOOK LIBRARY PANEL (reads Desktop\Books\ via /api/library/*) ── -->
        <div x-show="currentView==='library'" class="panel-enter space-y-6" x-cloak>
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div>
              <h1 class="text-2xl font-bold text-white">📚 Book Library</h1>
              <p class="text-xs text-slate-400 mt-1">
                Saves from the Sentinel Forge desktop Book Reader, live from
                <code class="text-emerald-300" x-text="libraryStats ? libraryStats.books_dir : '...'"></code>
              </p>
            </div>
            <button class="btn-secondary text-xs" @click="refreshLibrary()">⟳ Refresh</button>
          </div>

          <!-- ┌─ Ask Your Library (the platform-only feature) ─────────────┐ -->
          <div class="card p-5 border border-blue-700/50" style="background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(124,58,237,0.08));">
            <div class="flex items-center justify-between mb-2">
              <h2 class="font-semibold text-white flex items-center gap-2">
                <span class="text-xl">✨</span> Ask Your Library
              </h2>
              <span class="text-[10px] uppercase tracking-wider text-blue-300 bg-blue-900/40 px-2 py-0.5 rounded">platform feature</span>
            </div>
            <p class="text-xs text-slate-400 mb-3">
              Search across <strong class="text-slate-200" x-text="libraryStats?.total_saves ?? 0"></strong>
              saved excerpts at once. The standalone Book Reader can only search inside one file —
              the platform searches your whole reading history.
            </p>
            <div class="flex gap-2">
              <input type="text" placeholder='e.g. "what did I save about stoicism?" or "bushido honor"'
                     x-model="askQuestion"
                     @keydown.enter="askLibrary()"
                     class="flex-1">
              <button class="btn-primary whitespace-nowrap" @click="askLibrary()" :disabled="askLoading">
                <span x-show="!askLoading">Ask →</span>
                <span x-show="askLoading">Searching...</span>
              </button>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2" x-show="askHistory.length">
              <span class="text-[10px] text-slate-500 mr-1">recent:</span>
              <template x-for="q in askHistory" :key="q">
                <button class="text-[11px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700"
                        @click="useAskHistory(q)" x-text="q"></button>
              </template>
            </div>

            <!-- Results -->
            <template x-if="askResult">
              <div class="mt-4 space-y-3">
                <div class="text-xs text-emerald-300 italic" x-text="askResult.answer_synthesis"></div>
                <template x-if="askResult.matches.length === 0">
                  <div class="text-sm text-slate-500 py-4 text-center">
                    No excerpts matched. Try different terms.
                  </div>
                </template>
                <template x-for="m in askResult.matches" :key="m.filename">
                  <button class="w-full text-left bg-slate-900/60 hover:bg-slate-900 border border-slate-800 hover:border-blue-700 rounded-lg p-3 transition"
                          @click="openLibraryItem(m.filename)">
                    <div class="flex items-start justify-between gap-2 mb-1">
                      <div class="text-sm text-white font-medium truncate" x-text="sourceLabel(m.source_book) || m.doc_id"></div>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <span class="text-[10px] px-1.5 py-0.5 rounded border" :class="zoneClass(m.zone)" x-text="m.zone"></span>
                        <span class="text-[10px] text-blue-300 font-mono">score <span x-text="m.score"></span></span>
                      </div>
                    </div>
                    <div class="text-[11px] text-slate-300 leading-relaxed" x-text="m.snippet"></div>
                    <div class="flex flex-wrap gap-1 mt-1.5">
                      <template x-for="h in m.hits" :key="h">
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-200" x-text="h"></span>
                      </template>
                    </div>
                  </button>
                </template>
              </div>
            </template>
          </div>
          <!-- └──────────────────────────────────────────────────────────────┘ -->

          <!-- Stats strip -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3" x-show="libraryStats">
            <div class="card p-4">
              <div class="text-xs text-slate-400 uppercase tracking-wide">Total Saves</div>
              <div class="text-2xl font-bold text-white mt-1" x-text="libraryStats?.total_saves ?? 0"></div>
            </div>
            <div class="card p-4 zone-green">
              <div class="text-xs text-emerald-300 uppercase tracking-wide">🟢 GREEN</div>
              <div class="text-2xl font-bold text-white mt-1" x-text="libraryStats?.by_zone?.GREEN ?? 0"></div>
              <div class="text-[10px] text-slate-400">cog. load 7–10 · active</div>
            </div>
            <div class="card p-4 zone-yellow">
              <div class="text-xs text-amber-300 uppercase tracking-wide">🟡 YELLOW</div>
              <div class="text-2xl font-bold text-white mt-1" x-text="libraryStats?.by_zone?.YELLOW ?? 0"></div>
              <div class="text-[10px] text-slate-400">cog. load 4–6 · reference</div>
            </div>
            <div class="card p-4 zone-red">
              <div class="text-xs text-rose-300 uppercase tracking-wide">🔴 RED</div>
              <div class="text-2xl font-bold text-white mt-1" x-text="libraryStats?.by_zone?.RED ?? 0"></div>
              <div class="text-[10px] text-slate-400">cog. load 1–3 · archive</div>
            </div>
            <div class="card p-4">
              <div class="text-xs text-slate-400 uppercase tracking-wide">Total Words</div>
              <div class="text-2xl font-bold text-white mt-1" x-text="(libraryStats?.total_words ?? 0).toLocaleString()"></div>
              <div class="text-[10px] text-slate-400">avg load <span x-text="libraryStats?.avg_load ?? 0"></span></div>
            </div>
          </div>

          <!-- Zone filter chips + source search -->
          <div class="card p-4 flex items-center gap-2 flex-wrap">
            <span class="text-xs text-slate-400 mr-1">Zone:</span>
            <template x-for="z in ['ALL','GREEN','YELLOW','RED']" :key="z">
              <button
                class="px-3 py-1 rounded-md border text-xs font-semibold transition"
                :class="libraryZoneFilter===z ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'"
                @click="setLibraryZone(z)"
                x-text="z"></button>
            </template>
            <input type="text" placeholder="Filter by source filename..."
              class="text-xs ml-auto flex-1 max-w-xs"
              x-model.debounce.300ms="librarySourceFilter"
              @input="refreshLibrary()">
          </div>

          <!-- Excerpts list + preview pane -->
          <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">

    async api(method, path, body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (this.authToken) headers['Authorization'] = `Bearer ${this.authToken}`;
      if (this.apiKey) headers['X-API-Key'] = this.apiKey;
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(this.API_BASE + path, opts);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const ct = res.headers.get('content-type') || '';
      if (res.status === 204 || !ct.includes('json')) return null;
      return res.json();
    },

    // ─────────────────────────────────────

      const host = window.location.hostname;
      if (host === '127.0.0.1' || host === 'localhost' || host === '') {
        if (!this.authToken) {
          this.authToken = 'local-demo';
          this.userData = { email: 'local@sentinelforge', tier: 'pro', name: 'Local Demo' };

      this.startChartUpdater();

      this.authLoading = true;

        let token, user;
        if (this.MOCK_MODE) {
          await this.delay(800);
          token = 'mock_jwt_' + Math.random().toString(36).slice(2);
          user = { email: this.loginForm.email, tier: 'pro' };
        } else {
          const data = await this.api('POST', '/api/auth/login', this.loginForm);
          token = data.token || data.access_token;
          user = data.user || { email: this.loginForm.email, tier: data.tier || 'starter' };
        }
        this.authToken = token;
        this.userData = user;
        this.toast('Welcome back, ' + (user.email || 'user') + '!', 'success');
        await this.afterLogin();
      } catch (e) {
        this.authError = this.MOCK_MODE
          ? 'Could not connect. Entering mock mode — click Login again.'
          : 'Invalid credentials. Please check your email and password.';
        this.MOCK_MODE = true;
      } finally {
        this.authLoading = false;

        this.toast('Open a book first.', 'info');

      const text = useSelection ? (this.readerSelection || '').trim() : (this.readerCurrent.content || '').trim();

      this.readerSaving = true;
      try {

          zone:           this.readerSaveZone,

        this.refreshLibrary().catch(() => {});
      } catch (e) {
        this.toast('Save failed: ' + e.message, 'error');

        this.readerSaving = false;
      }

    async readerToolbarPaste() {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        this.toast('Clipboard not available — paste directly into the page.', 'info');
        return;
      }
      try {
        const text = await navigator.clipboard.readText();
        if (!text || !text.trim()) {
          this.toast('Clipboard is empty.', 'info');
          return;
        }
        const stamp = new Date().toISOString().replace('T', ' ').slice(0, 16);
        this.readerCurrent = {
          name:       `pasted-${stamp}.txt`,
          path:       '',
          ext:        '.txt',
          word_count: text.split(/\s+/).length,
          char_count: text.length,
          content:    text,
          front_matter: {},
        };
        this.readerSaveTitle = `pasted-${stamp.replace(/[^0-9]/g, '')}`;
        this.readerStatusMessage = `Pasted ${text.length} chars from clipboard.`;
        this.toast('Pasted from clipboard.', 'success');
      } catch (e) {
        this.toast('Paste failed: ' + e.message, 'error');
      }
    },

    readerSpeak() {
      if (!('speechSynthesis' in window)) {
        this.toast('Browser TTS not available.', 'error');
        return;
      }
      if (!this.readerCurrent || !(this.readerCurrent.content || '').trim()) {
        this.toast('Open a book or paste text first.', 'info');
        return;
      }
      // If user has a selection, read that; otherwise read whole page
      const sel  = (this.readerSelection || '').trim();
      const text = sel || this.readerCurrent.content;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      u.pitch = 1.0;
      u.volume = 1.0;
      u.onend   = () => { this.readerSpeaking = false; };
      u.onerror = () => { this.readerSpeaking = false; };
      this.readerUtterance = u;
      window.speechSynthesis.speak(u);
      this.readerSpeaking = true;
      this.readerStatusMessage = sel
        ? `Reading aloud (${sel.length} chars from selection)…`
        : `Reading aloud (whole page, ${text.length} chars)…`;
    },

    readerStopSpeak() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      this.readerSpeaking = false;
      if (this.readerCurrent) this.readerStatusMessage = 'Stopped.';
    },

    readerVoiceNote() {
      this.toast('Voice note: coming soon (browser MediaRecorder pending).', 'info');
    },

    readerToolbarStudy() {
      this.switchView('cognitive');
    },

    pickHighlightSwatch(name) {
      this.readerHighlightSwatch = name;
      this.readerHighlightColor  = this.readerHighlightSwatches[name];
    },

    readerHighlightSelection() {
      // Wrap the live selection in a colored span. Falls back to a
      // toast if the selection is empty or outside the reader body.
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.toString().length === 0) {
        this.toast('Select some text first.', 'info');
        return;
      }
      const range = sel.getRangeAt(0);
      // Refuse to highlight if selection crosses outside the reader body
      const body  = document.getElementById('reader-body');
      if (!body || !body.contains(range.commonAncestorContainer)) {
        this.toast('Select text inside the reader.', 'info');
        return;
      }
      const span = document.createElement('span');
      span.className   = 'reader-hl';
      span.style.background    = this.readerHighlightColor;
      span.style.color         = '#0f172a';
      span.style.padding       = '0 2px';
      span.style.borderRadius  = '2px';
      try {
        range.surroundContents(span);
      } catch (e) {
        // surroundContents fails across element boundaries — fall back
        const frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }
      sel.removeAllRanges();
      this.readerSelection = '';
      this.readerStatusMessage = `Highlighted in ${this.readerHighlightSwatch.toLowerCase()}.`;
    },

    readerStartTimer() {
      if (this.readerTimerRunning) {
        this.readerStopTimer();
        return;
      }
      const mins = parseInt(this.readerTimerDuration) || 10;
      this.readerTimerLeft    = mins * 60;
      this.readerTimerRunning = true;
      const tick = () => {
        if (!this.readerTimerRunning) return;
        this.readerTimerLeft -= 1;
        if (this.readerTimerLeft <= 0) {
          this.readerStopTimer();
          this.readerStatusMessage = '⏰ Timer done — take a break.';
          this.toast('⏰ Timer done — take a break.', 'success');
          try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=').play(); } catch (_) {}
        }
      };
      this.readerTimerInterval = setInterval(tick, 1000);
    },

    readerStopTimer() {
      if (this.readerTimerInterval) clearInterval(this.readerTimerInterval);
      this.readerTimerInterval = null;
      this.readerTimerRunning  = false;
    },

    readerTimerDisplay() {
      const s = Math.max(0, this.readerTimerLeft);
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const r = (s % 60).toString().padStart(2, '0');
      return `${m}:${r}`;
    },

    readerClearCommentary() {
      this.readerCommentary = null;
    },

    async loadReaderFolders() {
      try {
        const r = await this.api('GET', '/api/reader/folders');
        this.readerFolderConfig = r.folders || [];
      } catch (e) {
        this.toast('Could not load folders: ' + e.message, 'error');
      }
    },

    async addReaderFolder() {
      const p = (this.readerNewFolder || '').trim();
      if (!p) {
        this.toast('Type or paste a folder path first.', 'info');
        return;
      }
      this.readerFolderLoading = true;
      try {
        const r = await this.api('POST', '/api/reader/folders', { path: p });
        this.readerFolderConfig = r.folders || [];
        this.readerNewFolder = '';
        this.toast('Folder added. Refreshing book list…', 'success');
        await this.refreshReaderList();
      } catch (e) {
        this.toast('Add failed: ' + e.message, 'error');
      } finally {
        this.readerFolderLoading = false;
      }
    },

    async removeReaderFolder(path) {
      this.readerFolderLoading = true;
      try {
        const r = await this.api('DELETE', '/api/reader/folders?path=' + encodeURIComponent(path));
        this.readerFolderConfig = r.folders || [];
        this.toast('Folder removed. Refreshing book list…', 'info');
        await this.refreshReaderList();
      } catch (e) {
        this.toast('Remove failed: ' + e.message, 'error');
      } finally {
        this.readerFolderLoading = false;
      }
    },

    async readerOpenCommentary() {
      // Reuse the open modal but tag it as commentary mode
      // Simpler: prompt for filename or just reuse same modal
      this.readerOpenModalShow();
      this._commentaryPickNext = true;
    },

    // ─────────────────────────────────────
    // BOOK LIBRARY  (reads Desktop\Books\ via /api/library/*)
    // ─────────────────────────────────────
    async refreshLibrary() {
      this.libraryLoading = true;
      try {
        const params = new URLSearchParams();
        if (this.libraryZoneFilter !== 'ALL') params.set('zone', this.libraryZoneFilter);
        if (this.librarySourceFilter) params.set('source', this.librarySourceFilter);
        const [stats, list] = await Promise.all([
          this.api('GET', '/api/library/stats'),
          this.api('GET', '/api/library/excerpts' + (params.toString() ? '?' + params.toString() : '')),
        ]);
        this.libraryStats = stats;
        this.libraryItems = list.items || [];
      } catch (e) {
        this.toast('Library load failed: ' + e.message, 'error');
        this.libraryStats = null;
        this.libraryItems = [];
      } finally {
        this.libraryLoading = false;
      }
    },

    async openLibraryItem(filename) {
      this.libraryPreviewLoading = true;
      this.librarySelected = null;
      try {
        this.librarySelected = await this.api('GET', '/api/library/excerpt/' + encodeURIComponent(filename));
      } catch (e) {
        this.toast('Preview failed: ' + e.message, 'error');
      } finally {
        this.libraryPreviewLoading = false;
      }
    },

    setLibraryZone(z) {
      this.libraryZoneFilter = z;
      this.refreshLibrary();
    },

    async askLibrary() {
      const q = (this.askQuestion || '').trim();
      if (q.length < 2) {
        this.toast('Type a question first.', 'info');
        return;
      }
      this.askLoading = true;
      this.askResult = null;
      try {
        const r = await this.api('POST', '/api/library/ask', { question: q, top_k: 6 });
        this.askResult = r;
        this.askHistory = [q, ...this.askHistory.filter(x => x !== q)].slice(0, 5);
        if (r && r.matched === 0) this.toast('No matches yet — try broader terms.', 'info');
      } catch (e) {
        this.toast('Ask failed: ' + e.message, 'error');
      } finally {
        this.askLoading = false;
      }
    },

    useAskHistory(q) {
      this.askQuestion = q;
      this.askLibrary();
    },

    zoneClass(z) {
      if (z === 'GREEN')  return 'bg-emerald-500/15 text-emerald-300 border-emerald-700';
      if (z === 'YELLOW') return 'bg-amber-500/15 text-amber-300 border-amber-700';
      if (z === 'RED')    return 'bg-rose-500/15 text-rose-300 border-rose-700';
      return 'bg-slate-500/15 text-slate-300 border-slate-700';
    },

    sourceLabel(p) {
      if (!p) return 'unknown';
      const parts = p.split(/[\\/]/);
      return parts[parts.length - 1] || p;
    },

    async quickProcess() {
      if (!this.quickInput.trim()) return;
      this.quickLoading = true;
      this.quickResult = null;
      try {
        let result;
        if (this.MOCK_MODE) {
          await this.delay(700);
          result = { input: this.quickInput, output: 'PROCESSED:' + this.quickInput.toUpperCase(),
                     processing_time: 0.042, metadata: { zone: 'GREEN', resonance: 0.91, route: 'APEX→CORE→EMIT' } };
        } else {
          result = await this.api('POST', '/api/cog/process', { data: this.quickInput });
        }
        this.quickResult = result;
        this.toast('Input processed successfully.', 'success');
      } catch (e) {
        this.toast('Process failed: ' + e.message, 'error');
      } finally {
        this.quickLoading = false;
      }
    },

    // ─────────────────────────────────────
    // CHART
    // ─────────────────────────────────────
    startChartUpdater() {
      // Seed initial data
      for (let i = 0; i < 10; i++) this.cogChartData.push(Math.random() * 60 + 20);
      this.$nextTick(() => this.initChart());
      setInterval(() => {
        const next = Math.max(5, Math.min(95, (this.cogChartData[this.cogChartData.length-1] || 50) + (Math.random()-0.45)*12));
        this.cogChartData.push(next);
        if (this.cogChartData.length > 20) this.cogChartData.shift();
        this.cogLoad = Math.round(next);
        this.cogZone = next < 40 ? 'GREEN' : next < 70 ? 'YELLOW' : 'RED';
        if (this.cogChart) {
          this.cogChart.data.datasets[0].data = [...this.cogChartData];
          this.cogChart.data.labels = this.cogChartData.map((_,i) => 't-' + (this.cogChartData.length-1-i));
          this.cogChart.update('none');
        }
      }, 2000);
    },

    initChart() {
      const canvas = document.getElementById('cogChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 200);
      grad.addColorStop(0, 'rgba(59,130,246,0.4)');
      grad.addColorStop(1, 'rgba(59,130,246,0.01)');
      this.cogChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: this.cogChartData.map((_,i) => 't-' + (this.cogChartData.length-1-i)),
          datasets: [{
            label: 'Cognitive Load %',
            data: [...this.cogChartData],
            borderColor: '#3b82f6',
            backgroundColor: grad,
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: '#3b82f6',
            fill: true,
            tension: 0.4,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
          scales: {
            y: { min: 0, max: 100, grid: { color: '#1e293b' }, ticks: { color: '#64748b', callback: v => v + '%' } },
            x: { grid: { display: false }, ticks: { color: '#64748b', maxTicksLimit: 6 } },
          },
          animation: { duration: 400 },
        }
      });
    },

    // ─────────────────────────────────────
    // COGNITIVE ENGINE
    // ─────────────────────────────────────
    async loadCogStatus() {
      this.cogStatusLoading = true;
      try {
        this.cogStatus = this.MOCK_MODE
          ? (await this.delay(500), this.MOCK.status)
          : await this.api('GET', '/api/cog/status');
      } catch { this.cogStatus = this.MOCK.status; }
      finally { this.cogStatusLoading = false; }
    },

    async loadRules() {
      try {
        const data = this.MOCK_MODE
          ? (await this.delay(300), { rules: this.MOCK.rules })
          : await this.api('GET', '/api/cog/rules');
        this.cogRules = Object.entries(data.rules || {}).map(([pattern, tag]) => ({ pattern, tag }));
        if (!this.cogRules.length && Array.isArray(data.rules)) this.cogRules = data.rules;
        if (!this.cogRules.length) this.cogRules = this.MOCK.rules;
      } catch { this.cogRules = this.MOCK.rules; }
    },

    async addRule() {
      if (!this.newRule.pattern || !this.newRule.tag) return;
      const allRules = {};
      this.cogRules.forEach(r => { allRules[r.pattern] = r.tag; });
      allRules[this.newRule.pattern] = this.newRule.tag;
      try {
        if (!this.MOCK_MODE) await this.api('PUT', '/api/cog/rules', { rules: allRules });
        this.cogRules.push({ ...this.newRule });
        this.newRule = { pattern: '', tag: '' };
        this.showAddRule = false;
        this.toast('Rule added.', 'success');
      } catch (e) {
        this.toast('Failed to save rule.', 'error');
      }
    },

    deleteRule(idx) {
      this.cogRules.splice(idx, 1);
      this.toast('Rule deleted.', 'success');
    },

    confirmClearMemory() {
      this.modal = {
        show: true, title: 'Clear Memory Store',
        body: 'This will permanently delete all memory nodes. This action cannot be undone.',
        confirmLabel: 'Clear Memory',
        confirm: async () => {
          try {
            if (!this.MOCK_MODE) await this.api('DELETE', '/api/cog/memory');
            this.toast('Memory cleared.', 'success');
          } catch { this.toast('Failed to clear memory.', 'error'); }
        },
      };
    },

    async loadPrime() {
      this.primeLoading = true;
      try {
        this.prime = this.MOCK_MODE
          ? (await this.delay(400), this.MOCK.prime)
          : await this.api('GET', '/api/cog/prime');
      } catch { this.prime = this.MOCK.prime; }
      finally { this.primeLoading = false; }
    },

    // ─────────────────────────────────────
    // THREADS
    // ─────────────────────────────────────
    async loadThreads() {
      this.threadsLoading = true;
      try {
        let data;
        if (this.MOCK_MODE) {
          await this.delay(500);
          data = { threads: this.MOCK.threads };
        } else {
          data = await this.api('GET', '/api/cog/threads');
        }
        this.threads = Array.isArray(data) ? data : (data.threads || []);
        if (!this.threads.length) this.threads = this.MOCK.threads;
        await this.loadThreadStats();
      } catch { this.threads = this.MOCK.threads; }
      finally { this.threadsLoading = false; }
    },

    async loadThreadStats() {
      try {
        let stats;
        if (this.MOCK_MODE) stats = this.MOCK.stats;
        else stats = await this.api('GET', '/api/cog/stats');
        this.threadStats = [
          { label: 'Total Threads', value: this.threads.length },
          { label: 'Active',        value: this.threads.filter(t => t.status === 'active').length },
          { label: 'Intents',       value: this.fmt(stats?.intents || 7430) },
          { label: 'Topics',        value: stats?.topics || 18 },
        ];
      } catch {}
    },

    async selectThread(id) {
      this.selectedThreadId = id;
      try {
        let detail;
        if (this.MOCK_MODE) {
          await this.delay(300);
          detail = { ...this.MOCK.threadDetail, ...this.threads.find(t => t.id === id) };
        } else {
          detail = await this.api('GET', `/api/cog/threads/${id}`);
        }
        this.selectedThread = detail;
      } catch {
        this.selectedThread = this.threads.find(t => t.id === id) || null;
      }
    },

    get filteredThreads() {
      if (!this.threadFilter) return this.threads;
      const f = this.threadFilter.toLowerCase();
      return this.threads.filter(t => (t.topic || t.id || '').toLowerCase().includes(f));
    },

    // ─────────────────────────────────────
    // GLYPHS
    // ─────────────────────────────────────
    async loadGlyphs() {
      this.glyphsLoading = true;
      try {
        let data;
        if (this.MOCK_MODE) {
          await this.delay(400);
          data = this.MOCK.glyphs;
        } else {
          const raw = await this.api('GET', '/api/glyphs/aliases');
          data = Array.isArray(raw)
            ? raw
            : Object.entries(raw).map(([alias, target]) => ({ alias, target, icon: '◈' }));
        }
        this.glyphAliases = data.length ? data : this.MOCK.glyphs;
      } catch { this.glyphAliases = this.MOCK.glyphs; }
      finally { this.glyphsLoading = false; }
    },

    async interpretGlyph() {
      if (!this.glyphSeq.trim()) return;
      this.glyphInterpreting = true;
      this.glyphResult = null;
      try {
        let result;
        if (this.MOCK_MODE) {
          await this.delay(600);
          const toks = this.glyphSeq.split('->').map(s => s.trim());
          result = {
            tokens: toks,
            topics: toks.map(t => t.toLowerCase() + '-processing'),
            route: toks.map(t => (this.MOCK.glyphs.find(g => g.alias === t) || { target: t.toLowerCase() + '.node' }).target).join(' → '),
          };
        } else {
          result = await this.api('POST', '/api/glyphs/interpret', { sequence: this.glyphSeq });
        }
        this.glyphResult = result;
        this.toast('Sequence interpreted.', 'success');
      } catch (e) {
        this.toast('Interpretation failed: ' + e.message, 'error');
      } finally {
        this.glyphInterpreting = false;
      }
    },

    // ─────────────────────────────────────
    // SYNC
    // ─────────────────────────────────────
    async loadTrinode() {
      this.trinodeLoading = true;
      try {
        const data = this.MOCK_MODE
          ? (await this.delay(400), this.MOCK.trinode)
          : await this.api('GET', '/api/sync/trinode');
        this.trinode = Array.isArray(data) ? data : (data.nodes || this.MOCK.trinode);
      } catch { this.trinode = this.MOCK.trinode; }
      finally { this.trinodeLoading = false; }
    },

    async loadSnapshot() {
      this.snapshotLoading = true;
      try {
        this.snapshot = this.MOCK_MODE
          ? (await this.delay(350), this.MOCK.snapshot)
          : await this.api('GET', '/api/sync/snapshot');
      } catch { this.snapshot = this.MOCK.snapshot; }
      finally { this.snapshotLoading = false; }
    },

    connectWS() {
      if (this.wsSocket) return;
      const wsUrl = this.API_BASE.replace(/^http/, 'ws') + '/ws/sync';
      try {
        this.wsSocket = new WebSocket(wsUrl);
        this.wsSocket.onopen = () => {
          this.wsConnected = true;
          this.wsReconnectDelay = 1000;
          this.toast('WebSocket connected.', 'success');
        };
        this.wsSocket.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            this.pushWsEvent(msg.type || 'event', msg.data || msg);
          } catch { this.pushWsEvent('raw', { text: e.data }); }
        };
        this.wsSocket.onerror = () => { this.toast('WebSocket error.', 'error'); };
        this.wsSocket.onclose = () => {
          this.wsConnected = false;
          this.wsSocket = null;
          this.scheduleWsReconnect();
        };
      } catch {
        this.wsConnected = false;
        this.startMockWsStream();
      }
    },

    startMockWsStream() {
      // Simulate WS events in mock mode
      this.wsConnected = true;
      const types = ['cog.intent', 'sync.update'];
      const mockData = [
        { intent: 'route(APEX→CORE)',  confidence: 0.94 },
        { sync: 'trinode.heartbeat',   agent: 'sentinel-prime' },
        { intent: 'process(EMIT)',     resonance: 0.89 },
        { sync: 'snapshot.update',    nodes: 2891 },
      ];
      let i = 0;
      this._mockWsTimer = setInterval(() => {
        if (!this.wsConnected) return;
        this.pushWsEvent(types[i % 2], mockData[i % mockData.length]);
        i++;
      }, 2500);
      this.toast('WebSocket: mock stream active.', 'info');
    },

    disconnectWS() {
      if (this.wsSocket) { this.wsSocket.close(); this.wsSocket = null; }
      if (this._mockWsTimer) { clearInterval(this._mockWsTimer); this._mockWsTimer = null; }
      this.wsConnected = false;
      if (this.wsReconnectTimer) { clearTimeout(this.wsReconnectTimer); this.wsReconnectTimer = null; }
    },

    scheduleWsReconnect() {
      if (this.wsReconnectDelay > 30000) return;
      this.wsReconnectTimer = setTimeout(() => {
        this.wsReconnectDelay = Math.min(this.wsReconnectDelay * 2, 30000);
        this.connectWS();
      }, this.wsReconnectDelay);
    },

    pushWsEvent(type, data) {
      const now = new Date();
      const time = now.toTimeString().slice(0, 8);
      this.wsEvents.unshift({ id: Date.now() + Math.random(), type, data, time });
      if (this.wsEvents.length > 50) this.wsEvents.pop();
    },

    // ─────────────────────────────────────
    // BILLING
    // ─────────────────────────────────────
    confirmPlanChange(plan) {
      if (plan.id === 'enterprise') {
        this.toast('Contact sales@sentinelforge.io for Enterprise pricing.', 'info');
        return;
      }
      this.modal = {
        show: true, title: 'Change Plan',
        body: `Switch to ${plan.name} (${plan.price}/mo)? This will take effect immediately.`,
        confirmLabel: 'Confirm Change',
        confirm: () => {
          this.userData.tier = plan.id;
          this.toast(`Switched to ${plan.name} plan.`, 'success');
        },
      };
    },

    // ─────────────────────────────────────
    // SETTINGS
    // ─────────────────────────────────────
    copyApiKey() {
      navigator.clipboard.writeText(this.apiKey).then(() => {
        this.toast('API key copied to clipboard.', 'success');
      }).catch(() => {
        this.toast('Could not copy — please copy manually.', 'error');
      });
    },

    toggleTheme() {
      this.lightTheme = !this.lightTheme;
      document.getElementById('appBody').classList.toggle('light', this.lightTheme);
    },

    // ─────────────────────────────────────
    // UTILITIES
    // ─────────────────────────────────────
    toast(msg, type = 'info') {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, msg, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3800);
    },

    fmt(n) {
      return Number(n).toLocaleString();
    },

    delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    },
  };
}
</script>
</body>
</html>
